<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="selection:bg-white selection:text-black">

<div class="bg-glow"></div>
<div class="bg-grid"></div>

<div id="login-screen" class="min-h-screen flex items-center justify-center relative z-10 px-4">
    <div class="glass p-10 rounded-3xl w-full max-w-md relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-sky-500"></div>
        <h2 class="text-3xl font-light mb-2 text-white">Welcome Back</h2>
        <p class="text-zinc-400 mb-8 text-sm">Sign in to manage your portfolio</p>
        
        <input type="email" id="email" placeholder="Email address" class="mb-4">
        <input type="password" id="password" placeholder="Password" class="mb-8">
        
        <button id="login-btn" class="w-full bg-white text-black py-3 rounded-xl font-bold uppercase tracking-widest hover:bg-gray-200 cursor-pointer transition-colors">Login to Dashboard</button>
        <p id="login-error" class="text-red-400 text-sm mt-4 text-center"></p>
    </div>
</div>

<div id="dashboard-screen" class="max-w-5xl mx-auto py-12 px-6 relative z-10" style="display:none;">
    <header class="glass rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center mb-8">
        <h2 class="text-2xl font-light text-white tracking-widest uppercase">Admin <span class="font-bold grad-text">Panel</span></h2>
        <div class="flex gap-4 mt-4 md:mt-0">
            <a href="index.html" class="btn-ghost text-xs">Lihat Website</a>
            <button id="logout-btn" class="btn text-xs !bg-red-500/10 !text-red-400 !border-red-500/30 hover:!bg-red-500 hover:!text-white">Logout</button>
        </div>
    </header>

    <!-- Tabs Container -->
    <div class="flex overflow-x-auto gap-2 p-2 glass rounded-xl mb-8 w-max max-w-full">
        <button class="tab-btn active flex items-center" data-target="tab-profile">Profil</button>
        <button class="tab-btn flex items-center" data-target="tab-projects">Projects</button>
        <button class="tab-btn flex items-center" data-target="tab-skills">Skills</button>
        <button class="tab-btn flex items-center" data-target="tab-socials">Social Links</button>
    </div>

    <!-- TAB: PROFIL -->
    <div id="tab-profile" class="tab-content active glass p-8 rounded-3xl">
        <h3 class="text-xl font-light mb-6 text-white">Edit Profil Utama</h3>
        <div class="grid md:grid-cols-2 gap-6">
            <div><label>Nama Lengkap</label><input type="text" id="full_name" placeholder="John Doe"></div>
            <div><label>Nama Singkat (Logo)</label><input type="text" id="short_name" placeholder="John"></div>
            <div class="md:col-span-2"><label>Roles (Pisahkan dengan koma)</label><input type="text" id="roles" placeholder="Web Developer, UI Designer"></div>
            <div class="md:col-span-2"><label>Hero Description</label><textarea id="hero_desc" rows="2" placeholder="Brief description below your roles"></textarea></div>
            <div class="md:col-span-2"><label>About Text (Gunakan | untuk paragraf baru)</label><textarea id="about_text" rows="4" placeholder="Your long biography..."></textarea></div>
            <div><label>Email Kontak</label><input type="email" id="contact_email" placeholder="hello@example.com"></div>
            <div>
                <label>Foto Profil (Upload File)</label>
                <input type="file" id="profile_image_file" accept="image/*" class="text-sm">
                <input type="hidden" id="profile_image">
                <img id="profile_image_preview" src="" class="mt-4 h-24 w-24 object-cover rounded-xl border border-white/10 hidden">
            </div>
            <div class="md:col-span-2 mt-4">
                <button id="save-profile-btn" class="btn w-full !bg-indigo-600 !border-indigo-500 hover:!bg-indigo-500">Simpan Profil</button>
                <p id="save-msg" class="text-green-400 text-sm text-center mt-3"></p>
            </div>
        </div>
    </div>

    <!-- TAB: PROJECTS -->
    <div id="tab-projects" class="tab-content glass p-8 rounded-3xl">
        <h3 class="text-xl font-light mb-6 text-white">Manajemen Projects</h3>
        
        <div class="mb-10 p-6 rounded-2xl bg-black/20 border border-white/5">
            <h4 class="text-sm font-bold text-indigo-400 uppercase tracking-widest mb-4">Tambah Project Baru</h4>
            <div class="grid md:grid-cols-2 gap-4">
                <div><label>Judul Project</label><input type="text" id="new_proj_title" placeholder="Nama aplikasi..."></div>
                <div><label>Link GitHub</label><input type="text" id="new_proj_github" placeholder="https://github.com/..."></div>
                <div class="md:col-span-2"><label>Tags (Pisahkan koma)</label><input type="text" id="new_proj_tags" placeholder="React, Tailwind, Node.js"></div>
                <div class="md:col-span-2"><label>Deskripsi</label><textarea id="new_proj_desc" rows="2"></textarea></div>
                <div class="md:col-span-2">
                    <label>Gambar Project</label>
                    <input type="file" id="new_proj_image" accept="image/*" class="text-sm">
                </div>
                <div class="md:col-span-2 mt-4">
                    <button id="add-proj-btn" class="btn w-full !bg-green-600/20 !text-green-400 !border-green-500/30 hover:!bg-green-600 hover:!text-white">Tambah Project</button>
                    <p id="proj-msg" class="text-sm mt-3 text-center"></p>
                </div>
            </div>
        </div>

        <h4 class="text-sm font-bold text-zinc-400 uppercase tracking-widest mb-4">Daftar Project</h4>
        <div id="projects-list" class="grid gap-4"></div>
    </div>

    <!-- TAB: SKILLS -->
    <div id="tab-skills" class="tab-content glass p-8 rounded-3xl">
        <h3 class="text-xl font-light mb-6 text-white">Manajemen Skills</h3>
        <div class="flex flex-col md:flex-row gap-4 mb-8 items-end">
            <div class="flex-grow w-full"><label>Nama Skill</label><input type="text" id="new_skill_name" placeholder="misal: React JS"></div>
            <button id="add-skill-btn" class="btn h-fit !py-3 whitespace-nowrap !bg-green-600/20 !text-green-400 !border-green-500/30 hover:!bg-green-600 hover:!text-white">Tambah Skill</button>
        </div>
        <p id="skill-msg" class="text-sm mt-2 mb-6 text-center"></p>
        <ul id="skills-list" class="grid md:grid-cols-2 gap-3"></ul>
    </div>

    <!-- TAB: SOCIALS -->
    <div id="tab-socials" class="tab-content glass p-8 rounded-3xl">
        <h3 class="text-xl font-light mb-6 text-white">Manajemen Social Links</h3>
        <div id="socials-list" class="space-y-4 mb-8"></div>
        <button id="save-socials-btn" class="btn w-full !bg-indigo-600 !border-indigo-500 hover:!bg-indigo-500">Simpan Social Links</button>
        <p id="social-msg" class="text-sm text-center mt-4"></p>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    var db = createClient(
        'https://pohngtzslyytrimksoof.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvaG5ndHpzbHl5dHJpbWtzb29mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NDQ4MDEsImV4cCI6MjEwNjMyMDgwMX0.BHp-wF4qsj0qBXIQ2VwpEKK4XwJzbT4_LUKZTAgzUGo'
    );

    // TAB NAVIGATION
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.getAttribute('data-target')).classList.add('active');
        });
    });

    // UPLOAD HELPER
    async function uploadFile(file) {
        if (!file) return null;
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;
        
        const { data, error } = await db.storage.from('image').upload(fileName, file);
        if (error) throw error;
        
        const { data: publicUrlData } = db.storage.from('image').getPublicUrl(fileName);
        return publicUrlData.publicUrl;
    }

    // LOGIN & AUTH
    var session = await db.auth.getSession();
    if (session.data.session) showDashboard();

    document.getElementById('login-btn').addEventListener('click', async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('login-btn');
        const errEl = document.getElementById('login-error');
        
        if (!email || !pass) { errEl.innerText = 'Isi form!'; return; }
        
        btn.innerText = 'Loading...'; btn.disabled = true;
        const res = await db.auth.signInWithPassword({ email, password: pass });
        
        if (res.error) {
            errEl.innerText = res.error.message;
            btn.innerText = 'Login to Dashboard'; btn.disabled = false;
        } else {
            showDashboard();
        }
    });

    document.getElementById('password').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('login-btn').click();
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
        await db.auth.signOut();
        document.getElementById('login-screen').style.display = 'flex';
        document.getElementById('dashboard-screen').style.display = 'none';
    });

    function showDashboard() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'block';
        loadAllData();
    }

    // LOAD ALL DATA
    async function loadAllData() {
        loadProfile();
        loadProjects();
        loadSkills();
        loadSocials();
    }

    // --- PROFILE ---
    async function loadProfile() {
        const { data } = await db.from('profile').select('*').single();
        if (data) {
            document.getElementById('full_name').value = data.full_name || '';
            document.getElementById('short_name').value = data.short_name || '';
            document.getElementById('roles').value = data.roles || '';
            document.getElementById('hero_desc').value = data.hero_desc || '';
            document.getElementById('about_text').value = data.about_text || '';
            document.getElementById('contact_email').value = data.email || '';
            document.getElementById('profile_image').value = data.profile_image || '';
            
            if(data.profile_image) {
                const imgPreview = document.getElementById('profile_image_preview');
                imgPreview.src = data.profile_image;
                imgPreview.style.display = 'block';
            }
        }
    }

    document.getElementById('save-profile-btn').addEventListener('click', async () => {
        const msg = document.getElementById('save-msg');
        msg.innerText = 'Menyimpan...'; msg.className = 'text-yellow-400 text-sm mt-3 text-center';
        
        try {
            let imgUrl = document.getElementById('profile_image').value;
            const fileInput = document.getElementById('profile_image_file');
            if (fileInput.files.length > 0) {
                imgUrl = await uploadFile(fileInput.files[0]);
            }

            const { error } = await db.from('profile').update({
                full_name: document.getElementById('full_name').value,
                short_name: document.getElementById('short_name').value,
                roles: document.getElementById('roles').value,
                hero_desc: document.getElementById('hero_desc').value,
                about_text: document.getElementById('about_text').value,
                email: document.getElementById('contact_email').value,
                profile_image: imgUrl
            }).eq('id', 1);

            if (error) throw error;
            msg.innerText = 'Berhasil disimpan!'; msg.className = 'text-green-400 text-sm mt-3 text-center';
            loadProfile(); // reload img preview
        } catch (err) {
            msg.innerText = 'Gagal: ' + err.message; msg.className = 'text-red-400 text-sm mt-3 text-center';
        }
        setTimeout(() => msg.innerText = '', 3000);
    });

    // --- PROJECTS ---
    async function loadProjects() {
        const list = document.getElementById('projects-list');
        list.innerHTML = '<div class="text-zinc-400 text-sm">Loading projects...</div>';
        const { data } = await db.from('projects').select('*').order('id', {ascending: true});
        list.innerHTML = '';
        
        if(data && data.length > 0) {
            data.forEach(p => {
                const div = document.createElement('div');
                div.className = 'flex flex-col sm:flex-row justify-between sm:items-center bg-white/5 border border-white/10 p-5 rounded-2xl gap-4';
                div.innerHTML = `
                    <div class="flex gap-5 items-center">
                        <img src="${p.image}" class="w-20 h-20 object-cover rounded-xl shadow-lg border border-white/10">
                        <div>
                            <h5 class="font-bold text-white text-lg">${p.title}</h5>
                            <p class="text-xs text-indigo-300 uppercase tracking-widest mt-1">${p.tags}</p>
                            <a href="${p.github_link}" target="_blank" class="text-xs text-zinc-400 hover:text-white mt-2 inline-block">🔗 GitHub</a>
                        </div>
                    </div>
                    <button class="del-proj-btn btn !bg-red-500/10 !text-red-400 !border-red-500/30 hover:!bg-red-500 hover:!text-white whitespace-nowrap" data-id="${p.id}">Hapus</button>
                `;
                list.appendChild(div);
            });

            document.querySelectorAll('.del-proj-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    if(confirm('Hapus project ini?')) {
                        await db.from('projects').delete().eq('id', id);
                        loadProjects();
                    }
                });
            });
        } else {
            list.innerHTML = '<div class="text-zinc-500 text-sm">Belum ada project.</div>';
        }
    }

    document.getElementById('add-proj-btn').addEventListener('click', async () => {
        const msg = document.getElementById('proj-msg');
        const title = document.getElementById('new_proj_title').value;
        const desc = document.getElementById('new_proj_desc').value;
        const tags = document.getElementById('new_proj_tags').value;
        const github = document.getElementById('new_proj_github').value;
        const fileInput = document.getElementById('new_proj_image');
        
        if(!title) { msg.innerText = "Judul wajib diisi!"; msg.className="text-red-400 text-sm mt-3 text-center"; return; }
        
        msg.innerText = 'Mengupload dan menyimpan...'; msg.className="text-yellow-400 text-sm mt-3 text-center";
        try {
            let imgUrl = 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=800&auto=format&fit=crop'; // default
            if(fileInput.files.length > 0) {
                imgUrl = await uploadFile(fileInput.files[0]);
            }

            const { error } = await db.from('projects').insert([{
                title: title, description: desc, tags: tags, github_link: github, image: imgUrl
            }]);

            if(error) throw error;
            msg.innerText = 'Project ditambahkan!'; msg.className="text-green-400 text-sm mt-3 text-center";
            
            // reset form
            document.getElementById('new_proj_title').value = '';
            document.getElementById('new_proj_desc').value = '';
            document.getElementById('new_proj_tags').value = '';
            document.getElementById('new_proj_github').value = '';
            fileInput.value = '';
            
            loadProjects();
        } catch(err) {
            msg.innerText = 'Gagal: ' + err.message; msg.className="text-red-400 text-sm mt-3 text-center";
        }
        setTimeout(() => msg.innerText = '', 3000);
    });

    // --- SKILLS ---
    async function loadSkills() {
        const list = document.getElementById('skills-list');
        list.innerHTML = '<div class="text-zinc-400 text-sm col-span-2">Loading skills...</div>';
        const { data } = await db.from('skills').select('*').order('id');
        list.innerHTML = '';
        
        if(data && data.length > 0) {
            data.forEach(s => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-white/5 border border-white/10 px-5 py-3 rounded-xl';
                li.innerHTML = `<span class="text-zinc-200 font-medium">${s.skill_name}</span> <button class="del-skill-btn text-xs text-red-400 hover:text-red-300 uppercase tracking-widest font-bold" data-id="${s.id}">Hapus</button>`;
                list.appendChild(li);
            });

            document.querySelectorAll('.del-skill-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    await db.from('skills').delete().eq('id', id);
                    loadSkills();
                });
            });
        }
    }

    document.getElementById('add-skill-btn').addEventListener('click', async () => {
        const val = document.getElementById('new_skill_name').value;
        const msg = document.getElementById('skill-msg');
        if(!val) return;
        
        const { error } = await db.from('skills').insert([{ skill_name: val }]);
        if(error) { msg.innerText = error.message; msg.className="text-red-400"; }
        else {
            document.getElementById('new_skill_name').value = '';
            loadSkills();
        }
    });

    // --- SOCIALS ---
    let socialsData = [];
    async function loadSocials() {
        const list = document.getElementById('socials-list');
        list.innerHTML = 'Loading...';
        const { data } = await db.from('social_links').select('*').order('id');
        list.innerHTML = '';
        socialsData = data || [];
        
        if(data) {
            data.forEach(s => {
                const div = document.createElement('div');
                div.innerHTML = `<label>${s.platform}</label><input type="text" id="social_${s.id}" value="${s.url}">`;
                list.appendChild(div);
            });
        }
    }

    document.getElementById('save-socials-btn').addEventListener('click', async () => {
        const msg = document.getElementById('social-msg');
        msg.innerText = 'Menyimpan...'; msg.className = 'text-yellow-400 text-center mt-3 text-sm';
        
        try {
            for (let s of socialsData) {
                const newVal = document.getElementById(`social_${s.id}`).value;
                await db.from('social_links').update({ url: newVal }).eq('id', s.id);
            }
            msg.innerText = 'Social Links disimpan!'; msg.className = 'text-green-400 text-center mt-3 text-sm';
        } catch(err) {
            msg.innerText = 'Gagal: ' + err.message; msg.className = 'text-red-400 text-center mt-3 text-sm';
        }
        setTimeout(() => msg.innerText = '', 3000);
    });
</script>
</body>
</html>
