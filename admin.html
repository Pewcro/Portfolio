<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: #fff; font-family: sans-serif; }
        .glass { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px); }
        input, textarea { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.2); color: white; width: 100%; padding: 10px; border-radius: 5px; margin-top: 5px; }
        label { font-size: 0.8rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body class="p-6 md:p-12">

<div id="login-screen" class="max-w-sm mx-auto mt-20 glass p-8 rounded-xl text-center">
    <h2 class="text-2xl font-light mb-6 tracking-widest">ADMIN LOGIN</h2>
    <input type="email" id="email" placeholder="Email" class="mb-4">
    <input type="password" id="password" placeholder="Password" class="mb-6" onkeydown="if(event.key==='Enter')login()">
    <button id="login-btn" onclick="login()" class="w-full bg-white text-black py-3 rounded font-bold uppercase tracking-widest hover:bg-gray-200">Login</button>
    <p id="login-error" class="text-red-400 text-sm mt-4"></p>
</div>

<div id="dashboard-screen" class="max-w-2xl mx-auto hidden">
    <div class="flex justify-between items-center mb-10">
        <h2 class="text-3xl font-light tracking-wide">Dashboard</h2>
        <div class="space-x-4">
            <a href="index.html" class="text-sm text-gray-400 hover:text-white">Lihat Website</a>
            <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300">Logout</button>
        </div>
    </div>
    <div class="glass p-8 rounded-xl">
        <h3 class="text-xl mb-6 border-b border-white/10 pb-2">Edit Profil</h3>
        <div class="space-y-4">
            <div><label>Nama Lengkap</label><input type="text" id="full_name"></div>
            <div><label>Nama Singkat (Logo)</label><input type="text" id="short_name"></div>
            <div><label>Roles (Pisahkan dengan koma)</label><input type="text" id="roles"></div>
            <div><label>Hero Description</label><textarea id="hero_desc" rows="2"></textarea></div>
            <div><label>About Text (Gunakan | untuk paragraf baru)</label><textarea id="about_text" rows="4"></textarea></div>
            <div><label>Email Kontak</label><input type="email" id="contact_email"></div>
            <div><label>URL Foto Profil</label><input type="text" id="profile_image" placeholder="https://..."></div>
            <button onclick="saveProfile()" class="bg-blue-600 text-white px-6 py-2 rounded mt-4 hover:bg-blue-500 w-full">Simpan Perubahan</button>
            <p id="save-msg" class="text-green-400 text-sm text-center mt-2"></p>
        </div>
    </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', function() {
        var SUPA_URL = 'https://pohngtzslyytrimksoof.supabase.co';
        var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvaG5ndHpzbHl5dHJpbWtzb29mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3NDQ4MDEsImV4cCI6MjEwNjMyMDgwMX0.BHp-wF4qsj0qBXIQ2VwpEKK4XwJzbT4_LUKZTAgzUGo';
        var db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

        function checkAuth() {
            db.auth.getSession().then(function(res) {
                if (res.data.session) {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                    loadProfile();
                } else {
                    document.getElementById('login-screen').classList.remove('hidden');
                    document.getElementById('dashboard-screen').classList.add('hidden');
                }
            });
        }

        window.login = function() {
            var btn = document.getElementById('login-btn');
            var errEl = document.getElementById('login-error');
            var email = document.getElementById('email').value;
            var password = document.getElementById('password').value;

            if (!email || !password) { errEl.innerText = 'Email dan password harus diisi!'; return; }

            btn.innerText = 'Loading...';
            btn.disabled = true;
            errEl.innerText = '';

            db.auth.signInWithPassword({ email: email, password: password }).then(function(res) {
                if (res.error) {
                    errEl.innerText = res.error.message;
                    btn.innerText = 'Login';
                    btn.disabled = false;
                } else {
                    btn.innerText = 'Berhasil!';
                    checkAuth();
                }
            });
        };

        window.logout = function() {
            db.auth.signOut().then(function() { checkAuth(); });
        };

        function loadProfile() {
            db.from('profile').select('*').single().then(function(res) {
                var d = res.data;
                if (d) {
                    document.getElementById('full_name').value = d.full_name || '';
                    document.getElementById('short_name').value = d.short_name || '';
                    document.getElementById('roles').value = d.roles || '';
                    document.getElementById('hero_desc').value = d.hero_desc || '';
                    document.getElementById('about_text').value = d.about_text || '';
                    document.getElementById('contact_email').value = d.email || '';
                    document.getElementById('profile_image').value = d.profile_image || '';
                }
            });
        }

        window.saveProfile = function() {
            var msg = document.getElementById('save-msg');
            msg.innerText = 'Menyimpan...';
            msg.className = 'text-yellow-400 text-sm text-center mt-2';

            db.from('profile').update({
                full_name: document.getElementById('full_name').value,
                short_name: document.getElementById('short_name').value,
                roles: document.getElementById('roles').value,
                hero_desc: document.getElementById('hero_desc').value,
                about_text: document.getElementById('about_text').value,
                email: document.getElementById('contact_email').value,
                profile_image: document.getElementById('profile_image').value
            }).eq('id', 1).then(function(res) {
                if (res.error) {
                    msg.innerText = 'Gagal: ' + res.error.message;
                    msg.className = 'text-red-400 text-sm text-center mt-2';
                } else {
                    msg.innerText = 'Profil berhasil disimpan!';
                    msg.className = 'text-green-400 text-sm text-center mt-2';
                    setTimeout(function() { msg.innerText = ''; }, 3000);
                }
            });
        };

        checkAuth();
    });
</script>
</body>
</html>
